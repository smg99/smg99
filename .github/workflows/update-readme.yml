name: Update profile projects

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Update public projects table
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const profileRepo = context.repo.repo;
            const markerStart = '<!-- PUBLIC_PROJECTS_START -->';
            const markerEnd = '<!-- PUBLIC_PROJECTS_END -->';

            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: owner,
              type: 'owner',
              sort: 'pushed',
              direction: 'desc',
              per_page: 100
            });

            const publicRepos = repos
              .filter(repo => repo.private === false && repo.name !== profileRepo && repo.archived === false);

            const rows = [];

            for (const repo of publicRepos) {
              let lastUpdated = repo.pushed_at;
              let description = repo.description || '';

              try {
                const latest = await github.rest.repos.listCommits({
                  owner,
                  repo: repo.name,
                  per_page: 1
                });

                if (latest.data.length) {
                  lastUpdated = latest.data[0].commit.committer?.date ||
                                latest.data[0].commit.author?.date ||
                                lastUpdated;
                }
              } catch (error) {
                core.warning(`Could not fetch latest commit for ${repo.full_name}: ${error.message}`);
              }

              const date = lastUpdated
                ? new Date(lastUpdated).toISOString().slice(0, 10)
                : '—';

              rows.push(`| [${repo.name}](${repo.html_url}) | ${description.replace(/\|/g, '\\|')} | ${date} |`);
            }

            const generated = [
              markerStart,
              'This table is generated automatically from my public GitHub repositories. Private repositories are never included.',
              '',
              '| Project | Description | Last updated |',
              '|---|---|---|',
              ...rows,
              markerEnd
            ].join('\n');

            const fs = require('fs');
            const path = 'README.md';
            let readme = fs.readFileSync(path, 'utf8');
            const regex = new RegExp(`${markerStart}[\\s\\S]*?${markerEnd}`);

            if (!regex.test(readme)) {
              core.setFailed(`Could not find ${markerStart} / ${markerEnd} markers in README.md`);
              return;
            }

            const updated = readme.replace(regex, generated);
            fs.writeFileSync(path, updated);

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update public projects"
          git push
